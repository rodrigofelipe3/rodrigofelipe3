<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceDeepBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#120c24" />
      <stop offset="35%" stop-color="#0a081a" />
      <stop offset="70%" stop-color="#04050d" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <radialGradient id="cyanNebula" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleNebula" cx="88%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#5a189a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pulsing Core Gradient -->
    <radialGradient id="coreGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#ec4899" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Planet Gradients -->
    <radialGradient id="planetCyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#01142b" />
    </radialGradient>

    <radialGradient id="planetPink" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#26020a" />
    </radialGradient>

    <radialGradient id="planetEmerald" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022118" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes cometMove {
      0% { transform: translate(-100px, -40px); opacity: 0; }
      15% { opacity: 1; }
      55% { transform: translate(720px, 380px); opacity: 0.85; }
      100% { transform: translate(1100px, 580px); opacity: 0; }
    }
    .core-pulse {
      animation: pulseCore 3.5s ease-in-out infinite;
      transform-origin: 880px 180px;
    }
    .comet-anim {
      animation: cometMove 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Deep Space Canvas Background -->
  <rect width="1200" height="360" fill="url(#spaceDeepBg)" />
  <rect width="1200" height="360" fill="url(#cyanNebula)" />
  <rect width="1200" height="360" fill="url(#purpleNebula)" />

  <!-- Constellation Connections -->
  <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4,4">
    <line x1="70" y1="80" x2="150" y2="120" />
    <line x1="150" y1="120" x2="230" y2="70" />
    <line x1="230" y1="70" x2="320" y2="100" />
    <line x1="80" y1="280" x2="170" y2="300" />
    <line x1="170" y1="300" x2="260" y2="260" />
  </g>

  <!-- Starfield with Twinkle Animations -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="160" cy="130" r="1.2" opacity="0.6" />
    <circle cx="240" cy="40" r="2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="170" r="1.5" opacity="0.5" />
    <circle cx="420" cy="60" r="1.8" fill="#f43f5e">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="510" cy="140" r="1" opacity="0.7" />
    <circle cx="600" cy="50" r="1.8" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="90" cy="220" r="1" opacity="0.5" />
    <circle cx="170" cy="280" r="1.8" fill="#34d399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="270" cy="330" r="1.2" opacity="0.6" />
    <circle cx="380" cy="240" r="2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="490" cy="310" r="1.4" opacity="0.8" />
    <circle cx="590" cy="230" r="1.6" fill="#f43f5e">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <!-- Right side star clusters -->
    <circle cx="710" cy="60" r="1.8" fill="#38bdf8" />
    <circle cx="770" cy="110" r="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="990" cy="50" r="1.4" opacity="0.7" />
    <circle cx="1080" cy="90" r="2.2" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="140" r="1.2" opacity="0.6" />
    <circle cx="700" cy="270" r="1.8" fill="#34d399" />
    <circle cx="760" cy="330" r="1.3" opacity="0.7" />
    <circle cx="970" cy="320" r="2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1070" cy="300" r="2.2" fill="#f43f5e" />
    <circle cx="1140" cy="260" r="1.5" opacity="0.6" />
  </g>

  <!-- Shooting Meteor Trail -->
  <g class="comet-anim">
    <line x1="0" y1="0" x2="90" y2="45" stroke="url(#heroGradient)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="90" cy="45" r="3" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- ==================== ROTATING UNIVERSE / GALAXY (Center: 880, 180) ==================== -->
  <g id="spinning-galaxy">
    <!-- Orbital Rings -->
    <ellipse cx="880" cy="180" rx="250" ry="125" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8,6" transform="rotate(-15 880 180)" />
    <ellipse cx="880" cy="180" rx="190" ry="85" fill="none" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="12,8" transform="rotate(20 880 180)" />
    <ellipse cx="880" cy="180" rx="130" ry="55" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6,4" transform="rotate(-8 880 180)" />

    <!-- SPIRAL ARMS 1: Clockwise Rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 880 180" to="360 880 180" dur="30s" repeatCount="indefinite" />
      <path d="M 880 180 Q 955 120, 1035 150 T 1125 220" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-opacity="0.45" filter="url(#neonGlow)" stroke-linecap="round" />
      <path d="M 880 180 Q 955 120, 1035 150 T 1125 220" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" />
      
      <path d="M 880 180 Q 805 240, 725 210 T 635 140" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-opacity="0.45" filter="url(#neonGlow)" stroke-linecap="round" />
      <path d="M 880 180 Q 805 240, 725 210 T 635 140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" />

      <!-- Star Clusters on Arms -->
      <circle cx="990" cy="135" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
      <circle cx="1060" cy="170" r="3.5" fill="#ffffff" />
      <circle cx="1100" cy="205" r="2.2" fill="#34d399" />
      <circle cx="765" cy="225" r="3" fill="#f43f5e" filter="url(#neonGlow)" />
      <circle cx="695" cy="190" r="3.5" fill="#ffffff" />
      <circle cx="655" cy="155" r="2.2" fill="#38bdf8" />
    </g>

    <!-- SPIRAL ARMS 2: Counter-Clockwise Rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 880 180" to="0 880 180" dur="42s" repeatCount="indefinite" />
      <path d="M 880 180 Q 910 250, 950 285 T 1025 320" fill="none" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4" filter="url(#neonGlow)" stroke-linecap="round" />
      <path d="M 880 180 Q 850 110, 810 75 T 735 40" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.4" filter="url(#neonGlow)" stroke-linecap="round" />

      <circle cx="935" cy="268" r="2.4" fill="#fb7185" />
      <circle cx="825" cy="92" r="2.4" fill="#34d399" />
    </g>

    <!-- Orbiting Planet 1: Cyan with Rings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 880 180" to="360 880 180" dur="18s" repeatCount="indefinite" />
      <g transform="translate(1105, 180)">
        <ellipse cx="0" cy="0" rx="24" ry="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.85" transform="rotate(-28)" />
        <circle cx="0" cy="0" r="13" fill="url(#planetCyan)" filter="url(#neonGlow)" />
        <circle cx="18" cy="-10" r="2.5" fill="#ffffff" />
      </g>
    </g>

    <!-- Orbiting Planet 2: Pink Planet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 880 180" to="0 880 180" dur="26s" repeatCount="indefinite" />
      <g transform="translate(700, 180)">
        <circle cx="0" cy="0" r="9" fill="url(#planetPink)" filter="url(#neonGlow)" />
        <ellipse cx="0" cy="0" rx="16" ry="5" fill="none" stroke="#f43f5e" stroke-width="1.6" stroke-opacity="0.75" transform="rotate(32)" />
      </g>
    </g>

    <!-- Orbiting Planet 3: Emerald Planet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 880 180" to="360 880 180" dur="13s" repeatCount="indefinite" />
      <g transform="translate(880, 75)">
        <circle cx="0" cy="0" r="7" fill="url(#planetEmerald)" filter="url(#neonGlow)" />
      </g>
    </g>

    <!-- Central Supermassive Core -->
    <g class="core-pulse">
      <circle cx="880" cy="180" r="85" fill="url(#coreGlowGrad)" filter="url(#coreGlow)" />
      <circle cx="880" cy="180" r="42" fill="url(#coreGlowGrad)" />
      <circle cx="880" cy="180" r="16" fill="#ffffff" filter="url(#neonGlow)" />
      <line x1="880" y1="125" x2="880" y2="235" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
      <line x1="825" y1="180" x2="935" y2="180" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
    </g>
  </g>

  <!-- ==================== LEFT SIDE: DEVELOPER BRANDING & BIO ==================== -->
  <g transform="translate(60, 0)">
    <!-- Mission Tracker Tag -->
    <g transform="translate(0, 55)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#0b0f24" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.65" />
      <circle cx="16" cy="14" r="4" fill="#34d399">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
        FULLSTACK ARCHITECT
      </text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="900" fill="url(#heroGradient)" letter-spacing="2" filter="url(#neonGlow)">
        RODRIGO FELIPE
      </text>
      <!-- Subtitle -->
      <text x="2" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" letter-spacing="1">
        FULLSTACK DEVELOPER <tspan fill="#38bdf8">•</tspan> <tspan fill="#34d399">NODE.JS</tspan> &amp; <tspan fill="#38bdf8">TYPESCRIPT</tspan>
      </text>
    </g>

    <!-- Clean Tech Stack Badges (NO EMOJIS, Well Padded) -->
    <g transform="translate(0, 195)">
      <!-- Row 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="28" rx="7" fill="#0a0f26" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="62" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">
          Node.js &amp; NestJS
        </text>
      </g>

      <g transform="translate(135, 0)">
        <rect x="0" y="0" width="135" height="28" rx="7" fill="#0a0f26" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="67" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">
          Next.js &amp; Vite / Vue
        </text>
      </g>

      <g transform="translate(280, 0)">
        <rect x="0" y="0" width="120" height="28" rx="7" fill="#0a0f26" stroke="#777bb4" stroke-width="1.2" stroke-opacity="0.85" />
        <text x="60" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">
          PHP &amp; Laravel
        </text>
      </g>

      <g transform="translate(410, 0)">
        <rect x="0" y="0" width="110" height="28" rx="7" fill="#0a0f26" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="55" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fb7185">
          C# &amp; Python
        </text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="175" height="28" rx="7" fill="#0a0f26" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="87" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">
          Prisma, SQL &amp; MongoDB
        </text>
      </g>

      <g transform="translate(185, 38)">
        <rect x="0" y="0" width="145" height="28" rx="7" fill="#0a0f26" stroke="#ff7849" stroke-width="1.2" stroke-opacity="0.85" />
        <text x="72" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ff9f7d">
          RabbitMQ &amp; Redis
        </text>
      </g>
    </g>

    <!-- Subtitle Line -->
    <g transform="translate(0, 292)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        High-performance Web Applications, Event-Driven Architecture &amp; Resilient Systems
      </text>
    </g>
  </g>

  <!-- Technical Corner Marks -->
  <g stroke="#38bdf8" stroke-width="2" stroke-opacity="0.65" fill="none">
    <path d="M 20 40 L 20 20 L 40 20" />
    <path d="M 1160 20 L 1180 20 L 1180 40" />
    <path d="M 20 320 L 20 340 L 40 340" />
    <path d="M 1160 340 L 1180 340 L 1180 320" />
  </g>
</svg>
