<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceDeepBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#120c24" />
      <stop offset="35%" stop-color="#0a081a" />
      <stop offset="70%" stop-color="#04050d" />
      <stop offset="100%" stop-color="#010206" />
    </radialGradient>

    <!-- Nebula Clouds -->
    <radialGradient id="cyanNebula" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#4facfe" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleNebula" cx="88%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#5a189a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magentaNebula" cx="60%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Pulsing Singularity Core -->
    <radialGradient id="coreGlowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="25%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Gas Giant Planet Gradient -->
    <radialGradient id="gasGiant" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#03254c" />
      <stop offset="100%" stop-color="#010e1e" />
    </radialGradient>

    <!-- Rocky Planet Gradient -->
    <radialGradient id="rockyPlanet" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#be123c" />
      <stop offset="90%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#1a0208" />
    </radialGradient>

    <!-- Emerald Planet Gradient -->
    <radialGradient id="emeraldPlanet" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="90%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022118" />
    </radialGradient>

    <!-- Text Linear Gradient -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="deepCoreGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes floatTech {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes cometMove {
      0% { transform: translate(-100px, -50px); opacity: 0; }
      15% { opacity: 1; }
      55% { transform: translate(750px, 420px); opacity: 0.9; }
      100% { transform: translate(1100px, 600px); opacity: 0; }
    }
    .core-pulse {
      animation: pulseCore 3.5s ease-in-out infinite;
      transform-origin: 860px 200px;
    }
    .floating-cards {
      animation: floatTech 4s ease-in-out infinite;
    }
    .comet-anim {
      animation: cometMove 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="400" fill="url(#spaceDeepBg)" />
  <rect width="1200" height="400" fill="url(#cyanNebula)" />
  <rect width="1200" height="400" fill="url(#purpleNebula)" />
  <rect width="1200" height="400" fill="url(#magentaNebula)" />

  <!-- Constellation Wireframe Left Side -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,4">
    <line x1="80" y1="90" x2="160" y2="130" />
    <line x1="160" y1="130" x2="240" y2="80" />
    <line x1="240" y1="80" x2="330" y2="120" />
    <line x1="110" y1="310" x2="200" y2="340" />
    <line x1="200" y1="340" x2="290" y2="290" />
  </g>

  <!-- Starfield with Twinkle Animations -->
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="170" cy="140" r="1.2" opacity="0.6" />
    <circle cx="250" cy="50" r="2.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="180" r="1.5" opacity="0.5" />
    <circle cx="430" cy="70" r="1.8" fill="#f43f5e">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="150" r="1" opacity="0.7" />
    <circle cx="610" cy="55" r="1.8" fill="#a855f7">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="100" cy="240" r="1" opacity="0.5" />
    <circle cx="180" cy="300" r="1.8" fill="#34d399">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="280" cy="350" r="1.2" opacity="0.6" />
    <circle cx="390" cy="260" r="2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="330" r="1.4" opacity="0.8" />
    <circle cx="600" cy="240" r="1.6" fill="#f43f5e">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <!-- Right side star clusters -->
    <circle cx="710" cy="70" r="1.8" fill="#38bdf8" />
    <circle cx="770" cy="120" r="2.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="990" cy="60" r="1.4" opacity="0.7" />
    <circle cx="1080" cy="100" r="2.4" fill="#c084fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1140" cy="150" r="1.2" opacity="0.6" />
    <circle cx="690" cy="290" r="1.8" fill="#34d399" />
    <circle cx="750" cy="360" r="1.3" opacity="0.7" />
    <circle cx="960" cy="350" r="2" fill="#38bdf8">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1070" cy="330" r="2.2" fill="#f43f5e" />
    <circle cx="1150" cy="280" r="1.5" opacity="0.6" />
  </g>

  <!-- Shooting Star / Meteor Trail -->
  <g class="comet-anim">
    <line x1="0" y1="0" x2="100" y2="50" stroke="url(#heroGradient)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="100" cy="50" r="3.5" fill="#ffffff" filter="url(#neonGlow)" />
  </g>

  <!-- ==================== ROTATING 3D UNIVERSE / GALAXY (Right Side: 860, 200) ==================== -->
  <g id="spinning-galaxy">
    <!-- Orbital Rings with Ellipse Projections -->
    <ellipse cx="860" cy="200" rx="275" ry="140" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="8,6" transform="rotate(-15 860 200)" />
    <ellipse cx="860" cy="200" rx="210" ry="95" fill="none" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="12,8" transform="rotate(20 860 200)" />
    <ellipse cx="860" cy="200" rx="145" ry="60" fill="none" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.45" stroke-dasharray="6,4" transform="rotate(-8 860 200)" />

    <!-- SPIRAL ARM 1: Clockwise Rotation (SVG Native Animation) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 860 200" to="360 860 200" dur="32s" repeatCount="indefinite" />
      <!-- Arm A -->
      <path d="M 860 200 Q 945 135, 1030 165 T 1135 245" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-opacity="0.45" filter="url(#neonGlow)" stroke-linecap="round" />
      <path d="M 860 200 Q 945 135, 1030 165 T 1135 245" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" />
      <!-- Arm B (Opposite Arm) -->
      <path d="M 860 200 Q 775 265, 690 235 T 585 155" fill="none" stroke="#c084fc" stroke-width="4.5" stroke-opacity="0.45" filter="url(#neonGlow)" stroke-linecap="round" />
      <path d="M 860 200 Q 775 265, 690 235 T 585 155" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round" />

      <!-- Dense Star Clusters along Arm A -->
      <circle cx="985" cy="148" r="3" fill="#38bdf8" filter="url(#neonGlow)" />
      <circle cx="1060" cy="188" r="3.5" fill="#ffffff" />
      <circle cx="1105" cy="225" r="2.2" fill="#34d399" />
      <!-- Dense Star Clusters along Arm B -->
      <circle cx="735" cy="252" r="3" fill="#f43f5e" filter="url(#neonGlow)" />
      <circle cx="660" cy="212" r="3.5" fill="#ffffff" />
      <circle cx="615" cy="175" r="2.2" fill="#38bdf8" />
    </g>

    <!-- SPIRAL ARM 2: Counter-Clockwise Rotation -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 860 200" to="0 860 200" dur="45s" repeatCount="indefinite" />
      <!-- Arm C -->
      <path d="M 860 200 Q 895 280, 940 315 T 1020 355" fill="none" stroke="#f43f5e" stroke-width="3" stroke-opacity="0.4" filter="url(#neonGlow)" stroke-linecap="round" />
      <!-- Arm D -->
      <path d="M 860 200 Q 825 120, 780 85 T 700 45" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.4" filter="url(#neonGlow)" stroke-linecap="round" />

      <circle cx="920" cy="295" r="2.4" fill="#fb7185" />
      <circle cx="800" cy="105" r="2.4" fill="#34d399" />
    </g>

    <!-- ORBITING PLANET 1: Cyan Gas Giant with Saturn Rings (Rotates at 20s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 860 200" to="360 860 200" dur="20s" repeatCount="indefinite" />
      <g transform="translate(1110, 200)">
        <!-- Planetary Ring -->
        <ellipse cx="0" cy="0" rx="26" ry="8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.85" transform="rotate(-28)" />
        <!-- Planet Sphere -->
        <circle cx="0" cy="0" r="14" fill="url(#gasGiant)" filter="url(#neonGlow)" />
        <!-- Moon Orbiting Planet -->
        <circle cx="20" cy="-12" r="3" fill="#ffffff" />
      </g>
    </g>

    <!-- ORBITING PLANET 2: Crimson World (Rotates Counter-Clockwise at 28s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 860 200" to="0 860 200" dur="28s" repeatCount="indefinite" />
      <g transform="translate(660, 200)">
        <circle cx="0" cy="0" r="10" fill="url(#rockyPlanet)" filter="url(#neonGlow)" />
        <ellipse cx="0" cy="0" rx="18" ry="6" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-opacity="0.75" transform="rotate(32)" />
      </g>
    </g>

    <!-- ORBITING PLANET 3: Emerald Exo-Planet (Rotates at 14s) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 860 200" to="360 860 200" dur="14s" repeatCount="indefinite" />
      <g transform="translate(860, 80)">
        <circle cx="0" cy="0" r="8" fill="url(#emeraldPlanet)" filter="url(#neonGlow)" />
      </g>
    </g>

    <!-- CENTRAL PULSING SINGULARITY / UNIVERSE CORE -->
    <g class="core-pulse">
      <!-- Mega Outer Glow -->
      <circle cx="860" cy="200" r="95" fill="url(#coreGlowGrad)" filter="url(#deepCoreGlow)" />
      <!-- Middle Glow -->
      <circle cx="860" cy="200" r="48" fill="url(#coreGlowGrad)" />
      <!-- Pure White Supermassive Core -->
      <circle cx="860" cy="200" r="18" fill="#ffffff" filter="url(#neonGlow)" />
      <!-- Supernova Flare Rays -->
      <line x1="860" y1="135" x2="860" y2="265" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
      <line x1="795" y1="200" x2="925" y2="200" stroke="#ffffff" stroke-width="2" stroke-opacity="0.9" />
      <line x1="815" y1="155" x2="905" y2="245" stroke="#67e8f9" stroke-width="1.2" stroke-opacity="0.75" />
      <line x1="815" y1="245" x2="905" y2="155" stroke="#67e8f9" stroke-width="1.2" stroke-opacity="0.75" />
    </g>
  </g>

  <!-- ==================== LEFT SIDE: DEVELOPER BIO & TECH STACK ==================== -->
  <g transform="translate(65, 0)">
    <!-- Mission Tracker Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="320" height="32" rx="16" fill="#0b0f24" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.65" />
      <!-- Pulsing Radar Dot -->
      <circle cx="20" cy="16" r="5" fill="#34d399" filter="url(#neonGlow)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="36" y="21" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" letter-spacing="1.8">
        ✦ NAVIGATING THE TECH COSMOS ✦
      </text>
    </g>

    <!-- Main Name Title -->
    <g transform="translate(0, 158)">
      <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="48" font-weight="900" fill="url(#heroGradient)" letter-spacing="2.5" filter="url(#neonGlow)">
        RODRIGO FELIPE
      </text>
      <!-- Subtitle Track -->
      <text x="2" y="40" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" letter-spacing="1.2">
        FULLSTACK DEVELOPER <tspan fill="#38bdf8">•</tspan> <tspan fill="#34d399">NODE.JS</tspan> &amp; <tspan fill="#38bdf8">TYPESCRIPT</tspan>
      </text>
    </g>

    <!-- Floating Core Skill Badges -->
    <g transform="translate(0, 248)" class="floating-cards">
      <!-- Skill 1: Node & Nest -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="34" rx="10" fill="#0a0f26" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.85" />
        <text x="67" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#34d399">
          ⚡ Node &amp; NestJS
        </text>
      </g>

      <!-- Skill 2: Next & Vite -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="138" height="34" rx="10" fill="#0a0f26" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.85" />
        <text x="69" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">
          ⚛ Next.js &amp; Vite
        </text>
      </g>

      <!-- Skill 3: Prisma & DBs -->
      <g transform="translate(298, 0)">
        <rect x="0" y="0" width="165" height="34" rx="10" fill="#0a0f26" stroke="#c084fc" stroke-width="1.4" stroke-opacity="0.85" />
        <text x="82" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#d8b4fe">
          🌌 Prisma &amp; SQL/NoSQL
        </text>
      </g>

      <!-- Skill 4: Python & C# -->
      <g transform="translate(475, 0)">
        <rect x="0" y="0" width="130" height="34" rx="10" fill="#0a0f26" stroke="#f43f5e" stroke-width="1.4" stroke-opacity="0.85" />
        <text x="65" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fb7185">
          🐍 Python &amp; C#
        </text>
      </g>
    </g>

    <!-- Subtitle Description -->
    <g transform="translate(0, 328)">
      <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8">
        🚀 High-performance Web Applications, Scalable Microservices &amp; Resilient Architectures
      </text>
    </g>
  </g>

  <!-- Futuristic Corner Markers -->
  <g stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.75" fill="none">
    <path d="M 18 40 L 18 18 L 40 18" />
    <path d="M 1160 18 L 1182 18 L 1182 40" />
    <path d="M 18 360 L 18 382 L 40 382" />
    <path d="M 1160 382 L 1182 382 L 1182 360" />
  </g>
</svg>
