<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="coreBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Strip -->
  <rect width="1000" height="160" fill="#04060f" />

  <!-- Center Core Pulsing Glow -->
  <circle cx="500" cy="80" r="50" fill="url(#centerCore)" filter="url(#coreBlur)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Horizontal Cosmic Beam -->
  <line x1="50" y1="80" x2="950" y2="80" stroke="url(#orbitGrad)" stroke-width="2" />

  <!-- Rotating Orbit Rings around center -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 80" to="360 500 80" dur="18s" repeatCount="indefinite" />
    <ellipse cx="500" cy="80" rx="140" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" stroke-dasharray="10,6" />
    <circle cx="640" cy="80" r="6" fill="#38bdf8" filter="url(#coreBlur)" />
    <circle cx="360" cy="80" r="4" fill="#34d399" />
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 500 80" to="0 500 80" dur="24s" repeatCount="indefinite" />
    <ellipse cx="500" cy="80" rx="200" ry="45" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="8,8" />
    <circle cx="700" cy="80" r="5" fill="#f43f5e" filter="url(#coreBlur)" />
    <circle cx="300" cy="80" r="5" fill="#c084fc" />
  </g>

  <!-- Super Bright Central Star -->
  <circle cx="500" cy="80" r="10" fill="#ffffff" filter="url(#coreBlur)" />
  <line x1="500" y1="45" x2="500" y2="115" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.85" />
  <line x1="465" y1="80" x2="535" y2="80" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.85" />
</svg>
